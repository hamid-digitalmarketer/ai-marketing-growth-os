name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout shared package
        uses: actions/checkout@v4
        with:
          repository: hamid-digitalmarketer/ai-marketing-shared
          path: ai-marketing-shared
      - name: Install dependencies
        run: |
          pip install -e ./ai-marketing-shared
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout shared package
        uses: actions/checkout@v4
        with:
          repository: hamid-digitalmarketer/ai-marketing-shared
          path: ai-marketing-shared
      - name: Install dependencies
        run: |
          pip install -e ./ai-marketing-shared
          pip install -e ".[dev]"
      - name: Mypy typecheck
        run: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout shared package
        uses: actions/checkout@v4
        with:
          repository: hamid-digitalmarketer/ai-marketing-shared
          path: ai-marketing-shared
      - name: Install dependencies
        run: |
          pip install -e ./ai-marketing-shared
          pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout shared package
        uses: actions/checkout@v4
        with:
          repository: hamid-digitalmarketer/ai-marketing-shared
          path: ai-marketing-shared
      - name: Install dependencies
        run: |
          pip install -e ./ai-marketing-shared
          pip install -e ".[dev]"
      - name: Run evaluation suite
        run: |
          pytest evaluation/ -q -o addopts=""
          python -m evaluation.run

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-marketing-growth-os
      - name: Checkout shared package
        uses: actions/checkout@v4
        with:
          repository: hamid-digitalmarketer/ai-marketing-shared
          path: ai-marketing-shared
      - name: Build docker image
        run: docker build -t ai-marketing-growth-os:ci -f ai-marketing-growth-os/infra/Dockerfile .
