[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-marketing-growth-os"
version = "0.1.0"
description = "Flagship agentic marketing intelligence platform: a virtual digital marketing department with SEO, Ads, E-commerce, and Analytics agents, human-in-the-loop approval, and zero-API-key demo mode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Muhammad Hamid" }]
keywords = ["ai", "marketing", "agents", "fastapi", "mcp", "evaluation", "human-in-the-loop", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pandas>=2.0",
    "numpy>=1.26,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/hamid-digitalmarketer/ai-marketing-growth-os"
Documentation = "https://github.com/hamid-digitalmarketer/ai-marketing-growth-os/blob/main/docs/architecture.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "agents*", "tools*", "orchestration*", "demo*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation"]
addopts = "-q --cov=backend --cov=agents --cov=tools --cov=orchestration --cov=demo --cov=data.connectors --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["backend", "agents", "tools", "orchestration", "demo", "data"]
omit = ["*/tests/*", "*/evaluation/*", "*/infra/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "infra", "frontend", "data/sample_data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["backend", "agents", "tools", "orchestration", "demo", "data"]
